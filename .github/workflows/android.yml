name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  BUILD_MODE: prod

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Type check
        run: pnpm tsc --noEmit

      - name: Build web app
        run: pnpm build

      - name: Set up Capacitor
        run: |
          if [ ! -d "android" ]; then
            npx cap init "FeedScroll" "com.rayhandox.feedscroll" --web-dir=dist --skip-plugin-install --skip-git
          else
            echo "Android folder already exists, skipping cap init"
          fi
          npx cap sync android

      - name: Build Android APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          ls -la app/build/outputs/apk/debug/

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: feedscroll-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7